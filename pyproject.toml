[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ducktap"
version = "0.8.2"
description = "DuckTap — a CLI factory for AI agents. Print agent-native CLIs + MCP servers + skills from any API or website."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "DuckTap Contributors" }]
keywords = ["mcp", "cli", "llm", "agents", "openapi", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
# DuckTap's core loop is deterministic: spec in, code out, no model and no
# network beyond fetching the spec. Everything an LLM step needs lives in the
# `llm` extra so a plain `pip install ducktap` stays small. The MCP SDK is a
# dependency of the *generated* server package, not of the generator.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonref>=1.1",
    "fastapi>=0.110",            # web ui
    "python-multipart>=0.0.9",   # fastapi Form() parsing on /generate
    "uvicorn[standard]>=0.30",
    "click>=8.1",                # generated CLIs use Click
]

[project.optional-dependencies]
llm = [
    "litellm>=1.40",             # multi-LLM provider abstraction
]
sniff = [
    "playwright>=1.45",          # browser sniffing
    "mitmproxy>=11.0",
]
search = [
    "duckduckgo-search>=6.0",   # crowd-sniff web search
]
all = [
    "ducktap[llm,sniff,search]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # Not a DuckTap dependency -- the *generated* MCP server imports it, and
    # tests/test_e2e.py imports the generated package to prove it works.
    "mcp>=1.0",
]

[project.scripts]
ducktap = "ducktap.cli:app"

[project.urls]
Homepage = "https://github.com/zanni098/DuckTap"
Repository = "https://github.com/zanni098/DuckTap"
Issues = "https://github.com/zanni098/DuckTap/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ducktap"]

# Bundle the catalog recipes into the installed package so `pip install ducktap`
# ships them (registry.py loads them from ducktap/catalog/_recipes/).
[tool.hatch.build.targets.wheel.force-include]
"catalog" = "ducktap/catalog/_recipes"

[tool.hatch.build.targets.sdist]
include = ["src/ducktap", "catalog", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# E501: long lines OK in templates / docstrings.
# B008: required by Typer's `typer.Option(...)` default-arg idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src/ducktap"]
ignore_missing_imports = false

# Optional/untyped third-party libraries without stubs or py.typed markers.
# These are pulled in only by extras (llm/sniff/search) or ship no type info,
# so they are absent from a `.[dev]` install and must not fail the type check.
[[tool.mypy.overrides]]
module = ["jsonref", "playwright.*", "duckduckgo_search", "mitmproxy.*", "litellm"]
ignore_missing_imports = true
