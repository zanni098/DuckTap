name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q

  generated-clis:
    # Compile a generated CLI in each supported language to prove the
    # multi-language generators emit buildable projects, not just text.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install DuckTap
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile generated Go / Rust / TypeScript CLIs
        env:
          DUCKTAP_COMPILE_TESTS: "1"
        run: pytest -q tests/test_generated_multilang.py

  lockfile-audit:
    # The bundled pins are the default for every generated Python CLI, so a
    # stale pin is a shipped vulnerability. Fail CI when that happens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckTap and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Audit the bundled lockfile
        run: |
          python -c "from ducktap.generator.lockfile import render_requirements_lock; open('requirements.lock', 'w').write(render_requirements_lock())"
          pip-audit -r requirements.lock

  generated-docker:
    # Actually build all four generated Dockerfiles: source-level assertions
    # cannot catch an outdated toolchain image or a broken entrypoint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckTap
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build generated images
        env:
          DUCKTAP_DOCKER_TESTS: "1"
        run: pytest -q tests/test_dockerfile.py
